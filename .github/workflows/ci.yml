name: ci
on:
  pull_request: # PR: 테스트만 (합치기 전에 확인)
  push:
    branches: [main] # main: 테스트만 (합친 결과 확인)
    tags: ["v*"] # v1.0 같은 태그: 테스트 → 이미지 배포
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest # 윈도우/macOS도 지원하지만 비용 UP
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # uv.lock 그대로 설치 후 실행 (로컬·VS Code 와 같은 설정)
      - run: uv run --locked pytest -q

  image: # ── 배포: 테스트를 통과하면 이미지 빌드·푸시 ────────
    needs: parity
    if: startsWith(github.ref, 'refs/tags/v') # v 로 시작하는 태그를 푸시했을 때만 이미지 배포
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:     
          name: model-artifacts
          path: artifacts/
      - name: 이미지 이름 (소문자)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Python API (구현체를 rule → onnx 로 교체, scikit-learn 없이 서빙)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: true
          build-args: |
            MODEL_IMPL=onnx
            APP_VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}/eta-api:${{ github.ref_name }}
            ${{ env.IMAGE }}/eta-api:latest

      - name: Go 서비스 (같은 ONNX 모델)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api-go/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}/eta-go:${{ github.ref_name }}
            ${{ env.IMAGE }}/eta-go:latest    
                    
      - name: Rust 서비스 (같은 ONNX 모델)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api-rust/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}/eta-rust:${{ github.ref_name }}
            ${{ env.IMAGE }}/eta-rust:latest


  # ── MLOps 2단계: 재현 가능한 학습 + 모델 검증 게이트 + ONNX 변환 ──
  train:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # 학습 라이브러리(scikit-learn, torch, ONNX 변환 도구)는 pyproject.toml 의 train 그룹. 로컬과 같은 명령이다.
      - run: mkdir -p artifacts # 커밋하지 않는 폴더라 새 checkout 에는 없다
      - run: uv run --locked --group train python -m training.train_sklearn
      - run: uv run --locked python -m training.validate_model sklearn # 실패하면 여기서 중단 → 배포 안 됨
      - run: uv run --locked --group train python -m training.train_dl
      - run: uv run --locked python -m training.validate_model dl
      - run: uv run --locked --group train python -m training.export_onnx # 원본 vs ONNX 예측 일치 확인 포함
      - uses: actions/upload-artifact@v7
        with:
          name: model-artifacts
          path: artifacts/

  # ── MLOps 3단계: 교차 런타임 일치 테스트 ─────────────────────
  parity:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: model-artifacts
          path: artifacts/
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Go·Rust 이미지 빌드
        run: |
          docker build -f api-go/Dockerfile -t eta-go .
          docker build -f api-rust/Dockerfile -t eta-rust .
      - name: 세 서비스 실행 (Python 8080, Go 8081, Rust 8082. 컨테이너 안은 모두 8080)
        run: |
          # Python 쪽은 학습한 원본(scikit-learn) 모델로 띄워 Go·Rust(ONNX)와 비교한다
          MODEL_IMPL=sklearn uv run --locked --group train uvicorn api.app:app --port 8080 &
          docker run -d -p 8081:8080 eta-go
          docker run -d -p 8082:8080 eta-rust
          for i in $(seq 1 60); do
            curl -sf -o /dev/null localhost:8080/health && curl -sf -o /dev/null localhost:8081/health \
              && curl -sf -o /dev/null localhost:8082/health && exit 0
            sleep 1
          done
          exit 1
      - run: uv run --locked python -m training.check_parity # Python vs Go, Python vs Rust

  # ── 모델 릴리스: 검증을 통과한 모델 파일을 GitHub Release 에 첨부 ──
  #    코드(태그) · 이미지(GHCR) · 모델(Release) 이 같은 버전(v1.0 등)으로 묶인다
  release:
    needs: parity
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release 를 만들 권한. 이 job 에만 준다
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: model-artifacts
          path: artifacts/
      - name: GitHub Release 만들고 모델 첨부
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            artifacts/model_sklearn.onnx \
            artifacts/model_dl.onnx \
            artifacts/metrics_sklearn.json \
            artifacts/metrics_dl.json

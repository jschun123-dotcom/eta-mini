name: ci
on:
  pull_request: # PR: 테스트만 (합치기 전에 확인)
  push:
    branches: [main] # main: 테스트만 (합친 결과 확인)
    tags: ["v*"] # v1.0 같은 태그: 테스트 → 이미지 배포
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest # 윈도우/macOS도 지원하지만 비용 UP
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # uv.lock 그대로 설치 후 실행 (로컬·VS Code 와 같은 설정)
      - run: uv run --locked pytest -q

  image: # ── 배포: 테스트를 통과하면 이미지 빌드·푸시 ────────
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') # v 로 시작하는 태그를 푸시했을 때만 이미지 배포
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 이름 (소문자)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: true
          build-args: MODEL_IMPL=rule
          tags: |
            ${{ env.IMAGE }}/eta-api:${{ github.ref_name }}
            ${{ env.IMAGE }}/eta-api:latest

  # ── MLOps 2단계: 재현 가능한 학습 + 모델 검증 게이트 + ONNX 변환 ──
  # 모델마다 job 을 나눠, 어느 모델이 실패했는지 Actions 화면에서 바로 보이게 한다 (둘은 병렬 실행)
  train-sklearn:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: mkdir -p artifacts # 커밋하지 않는 폴더라 새 checkout 에는 없다
      - name: 학습 (sklearn)
        run: uv run --locked --group train python -m training.train_sklearn
      - name: 검증 게이트 (sklearn) # 실패하면 여기서 중단 → 업로드·배포 안 됨
        run: uv run --locked python -m training.validate_model sklearn
      - uses: actions/upload-artifact@v7
        with:
          name: model-sklearn
          path: artifacts/

  train-dl:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: mkdir -p artifacts
      - name: 학습 (dl)
        run: uv run --locked --group train python -m training.train_dl
      - name: 검증 게이트 (dl)
        run: uv run --locked python -m training.validate_model dl
      - uses: actions/upload-artifact@v7
        with:
          name: model-dl
          path: artifacts/